# Diffgloss Configuration Example
# Place at repository root as `diffgloss.yaml`

# Primary explainer dialect: anthropic | openai | openai-chat | google | mock
provider: anthropic
model: claude-sonnet-4-5

# Optional custom OpenAI-compatible endpoint (OpenRouter, Ollama, LiteLLM, etc.)
# base_url: http://127.0.0.1:11434/v1
# api_key_env: OPENAI_API_KEY

# Optional independent cross-model semantic grounding judge & answer verifier
# judge_provider: openai
# judge_model: gpt-5.1

# quick | standard | deep (deep enables cold-start semantic grounding judge)
effort: standard

# Hard USD budget cap per run; remaining hunks stay honestly marked `unexplained`
budget_usd: 1.5
max_questions: 6

# Security & privacy defaults
rules_from_base: true
redact_secrets: true

# Structural sub-hunk splitting for giant multi-function git hunks
split_large_hunks: true
subhunk_line_threshold: 40

ignore:
  - "**/*.generated.ts"
  - "docs/api-dump/**"
