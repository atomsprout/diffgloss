[package]
name = "diffgloss-desktop"
version = "0.3.0"
description = "Diffgloss native desktop workbench for macOS and Windows"
authors = ["atomsprout"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
