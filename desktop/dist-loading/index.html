<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diffgloss — Starting Workbench</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f10;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      gap: 14px;
    }
    .gem {
      font-size: 40px;
      color: #f59e0b;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .sub { color: #a1a1aa; font-size: 13px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="gem">◆</div>
  <div style="font-size:18px;font-weight:700">Diffgloss</div>
  <div class="sub">Starting local explainability engine...</div>
</body>
</html>
